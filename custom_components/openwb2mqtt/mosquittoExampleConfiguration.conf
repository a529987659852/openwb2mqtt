# Example: bridge the openWB simpleAPI topics to your own Mosquitto broker
# (for example the Mosquitto add-on of Home Assistant).
# Requires openWB 2.1.9 or newer (simpleAPI).

connection openwb2
local_clientid openwb2.mosquitto

#TODO: Replace IP address with the address of your openWB
address 192.168.0.68:1883

# All simpleAPI topics in both directions:
# - values from openWB ({root}/simpleAPI/...)
# - commands from Home Assistant ({root}/simpleAPI/set/...)
# If you changed the MQTT root topic in the integration, replace "openWB" here as well.
topic openWB/simpleAPI/# both 2
